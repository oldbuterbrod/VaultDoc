version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: vaultdoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultdoc_db
      POSTGRES_USER: vaultdoc_user
      POSTGRES_PASSWORD: vaultdoc_pass
    volumes:
      - vaultdoc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdoc_user -d vaultdoc_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vaultdoc_internal

  backend:
    build:
      context: ../backend
    container_name: vaultdoc-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://vaultdoc_user:vaultdoc_pass@db:5432/vaultdoc_db
      SECRET_KEY: change-me-to-a-long-random-string
      DEBUG: "false"
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      MAX_UPLOAD_SIZE_MB: 10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vaultdoc_documents:/app/storage/documents
    networks:
      - vaultdoc_internal

  frontend:
    build:
      context: ../frontend
    container_name: vaultdoc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vaultdoc_internal

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: vaultdoc-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vaultdoc_internal

volumes:
  vaultdoc_db_data:
  vaultdoc_documents:

networks:
  vaultdoc_internal:
    driver: bridge
